<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cortavo</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f2f2f2;
        color: #191919;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 32px;
      }
      .cx { max-width: 320px; }
      h1 { font-size: 21px; font-weight: 600; letter-spacing: -0.5px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.55; color: #6b6b6b; margin: 0 0 22px; }
      button {
        font: inherit;
        font-weight: 600;
        font-size: 14px;
        background: #191919;
        color: #fff;
        border: none;
        border-radius: 999px;
        padding: 13px 26px;
        cursor: pointer;
      }
      button:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <!--
      Tela mostrada quando o app abre sem conseguir alcançar o servidor.

      O Cortavo é servido pelo servidor (páginas renderizadas lá), então o app
      nativo é uma casca que carrega https://cortavo.com.br — não há versão
      offline do painel para cair. Sem esta tela, o usuário sem internet veria
      o erro cru do navegador dentro do app, que parece app quebrado.
    -->
    <div class="cx">
      <h1>Sem conexão</h1>
      <p>O Cortavo precisa de internet para carregar sua agenda. Verifique a conexão e tente de novo.</p>
      <button onclick="location.replace('https://cortavo.com.br')">Tentar de novo</button>
    </div>
  </body>
</html>
